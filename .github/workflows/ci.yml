name: CI

on:
  pull_request:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.4'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p '*_test.py'
      # Race instrumentation needs cgo/toolchain; production binaries do not.
      - run: CGO_ENABLED=1 go test -race ./...
      - name: Scan tracked source and fixtures (offline, redacted)
        shell: bash
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          mkdir "$RUNNER_TEMP/scan"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/scan"
          "$(go env GOPATH)/bin/gitleaks" dir --redact --no-banner "$RUNNER_TEMP/scan"

  docker:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - run: go run ./scripts/build.go -build-id "sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: energything:ci-${{ matrix.arch }}
      - name: Runtime SQLite, synthetic collection, lifecycle and private-file gates
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "bin/probes/$ARCH"
          go build -o "bin/probes/$ARCH/operations-probe" ./scripts/operations-probe
          for package in storage collection; do
            go test -c -o "bin/probes/$ARCH/$package.test" "./internal/$package"
            docker run --rm --network none --platform "linux/$ARCH" --entrypoint /probe -v "$PWD/bin/probes/$ARCH/$package.test:/probe:ro" "energything:ci-$ARCH" -test.timeout=10m
          done
          python3 scripts/verify-operations.py --image "energything:ci-$ARCH" --platform "linux/$ARCH" --build-id "sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Install scanner for the runner architecture, not the emulated target.
          env -u GOOS -u GOARCH -u CGO_ENABLED go install github.com/zricethezav/gitleaks/v8@v8.30.1
          python3 scripts/verify-image-context.py --image "energything:ci-$ARCH" --scanner "$(go env GOPATH)/bin/gitleaks"

  publish:
    # Only an explicit, non-draft, non-prerelease published release can reach secrets.
    # Tags alone, PRs, ordinary pushes and manual dry builds never log in or push.
    if: github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease
    needs: [test, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub-release
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate explicit version and registry destination
        run: python3 scripts/release_policy.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run ./scripts/build.go -build-id "$BUILD_ID"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ env.BUILD_ID }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
