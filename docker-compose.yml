services:
  energything:
    image: ${ENERGYTHING_IMAGE:-energything:local}
    restart: unless-stopped
    ports:
      - "${ENERGYTHING_HTTP_PORT:-8080}:8080"
    environment:
      ENERGYTHING_USERNAME: ${ENERGYTHING_USERNAME:?Set ENERGYTHING_USERNAME}
      ENERGYTHING_PASSWORD: ${ENERGYTHING_PASSWORD:?Set ENERGYTHING_PASSWORD}
      ENERGYTHING_HTTP_ADDR: ":8080"
      ENERGYTHING_DATA_DIR: /data
      ENERGYTHING_TIMEZONE: ${ENERGYTHING_TIMEZONE:-Europe/London}
      ENERGYTHING_HISTORY_START: ${ENERGYTHING_HISTORY_START:-2022-01-01}
      ENERGYTHING_SHUTDOWN_TIMEOUT: ${ENERGYTHING_SHUTDOWN_TIMEOUT:-10s}
      OCTOPUS_API_KEY: ${OCTOPUS_API_KEY:-}
      OCTOPUS_ACCOUNT_NUMBER: ${OCTOPUS_ACCOUNT_NUMBER:-}
      OCTOPUS_IMPORT_MPAN: ${OCTOPUS_IMPORT_MPAN:-}
      OCTOPUS_IMPORT_SERIAL: ${OCTOPUS_IMPORT_SERIAL:-}
      OCTOPUS_EXPORT_MPAN: ${OCTOPUS_EXPORT_MPAN:-}
      OCTOPUS_EXPORT_SERIAL: ${OCTOPUS_EXPORT_SERIAL:-}
      OCTOPUS_REFRESH_INTERVAL: ${OCTOPUS_REFRESH_INTERVAL:-1h}
      GROWATT_API_TOKEN: ${GROWATT_API_TOKEN:-}
      GROWATT_PLANT_ID: ${GROWATT_PLANT_ID:-}
      GROWATT_DEVICE_SERIAL: ${GROWATT_DEVICE_SERIAL:-}
      GROWATT_LATEST_INTERVAL: ${GROWATT_LATEST_INTERVAL:-5m}
      GROWATT_HISTORY_INTERVAL: ${GROWATT_HISTORY_INTERVAL:-1h}
      GROWATT_AGGREGATE_DAILY_CAP_ENABLED: ${GROWATT_AGGREGATE_DAILY_CAP_ENABLED:-false}
    volumes:
      - ${ENERGYTHING_DATA_PATH:-./energything-data}:/data
